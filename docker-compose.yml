services:
  homepage:
    build: .
    image: homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATA_PATH=/app/data/data.json
    volumes:
      - ./data:/app/data
    user: "1000:1000"

  # Cloudflare Tunnel edge for HTTPS (skipped unless started with --profile tunnel).
  # Browser sees https://<hostname> terminated at Cloudflare; tunnel reaches homepage internally.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}