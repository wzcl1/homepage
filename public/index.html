<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#16151a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Homepage">
  <title>Homepage</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <section class="panel" id="links-panel">
      <details class="section-toggle" open>
        <summary>
          <span class="summary-label">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            Links
          </span>
          <span class="section-count" id="link-count">0</span>
        </summary>
        <form id="link-form" class="add-form" hidden>
          <div class="field">
            <label for="link-url">URL</label>
            <input type="url" id="link-url" name="url" placeholder="https://example.com" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="link-label">Label</label>
            <input type="text" id="link-label" name="label" placeholder="Optional label" autocomplete="off">
          </div>
          <button type="submit">Add link</button>
        </form>
        <ul id="link-list" class="item-list"></ul>
      </details>
    </section>

    <section class="panel" id="notes-panel">
      <details class="section-toggle" open>
        <summary>
          <span class="summary-label">
            <svg class="section-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14 2 14 8 20 8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
            Notes
          </span>
          <span class="section-count" id="note-count">0</span>
        </summary>
        <form id="note-form" class="add-form" hidden>
          <div class="field">
            <label for="note-text">Note</label>
            <textarea id="note-text" name="text" rows="3" placeholder="Write a note..." required></textarea>
          </div>
          <button type="submit">Add note</button>
        </form>
        <ul id="note-list" class="item-list"></ul>
      </details>
    </section>
  </main>

  <button id="fab" class="fab" aria-label="New link or note" aria-haspopup="dialog">+</button>

  <div id="sheet-mask" class="sheet-mask hidden">
    <div class="bottom-sheet" role="dialog" aria-label="Create new">
      <button type="button" data-action="link">New link</button>
      <button type="button" data-action="note">New note</button>
    </div>
  </div>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <script src="app.js"></script>
</body>
</html>
